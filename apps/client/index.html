<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcanorum</title>
    <style>
      html,
      body,
      #root,
      main {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        overflow: hidden;
      }

      .arc-hex-map,
      .arc-hex-map__surface {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .arc-hex-map__surface canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
